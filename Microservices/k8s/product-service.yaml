# ==========================================
# 2. PRODUCT SERVICE (Port 3001)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: default
  labels:
    app: product-service
    tier: backend
    part-of: ecommerce-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
      tier: backend
  template:
    metadata:
      labels:
        app: product-service
        tier: backend
        part-of: ecommerce-platform
    spec:
      containers:
        - name: product-service
          image: malikaj/product-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: SERVICE_PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: CACHE_HOST
              value: "redis-cluster.default.svc.cluster.local"
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: product-db-secret
                  key: uri
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: default
  labels:
    app: product-service
    part-of: ecommerce-platform
spec:
  type: NodePort
  selector:
    app: product-service
    tier: backend
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
