# ==========================================
# 3. ORDER SERVICE (Port 3002)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
    tier: backend
    part-of: ecommerce-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
      tier: backend
  template:
    metadata:
      labels:
        app: order-service
        tier: backend
        part-of: ecommerce-platform
    spec:
      containers:
        - name: order-service
          image: malikaj/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
            - name: SERVICE_PORT
              value: "3002"
            - name: NODE_ENV
              value: "production"
            - name: USER_SERVICE_URL
              value: "http://user-service.default.svc.cluster.local:3000"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service.default.svc.cluster.local:3001"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
    part-of: ecommerce-platform
spec:
  type: NodePort
  selector:
    app: order-service
    tier: backend
  ports:
    - name: http
      protocol: TCP
      port: 3002
      targetPort: 3002
